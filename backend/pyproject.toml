[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-news-rag"
version = "1.0.0"
description = "Closed-book RAG prototype for stock market news"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "numpy>=2.0,<3.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "scikit-learn>=1.7,<2.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
rag = [
  "chromadb>=1.0,<2.0",
  "langgraph>=0.6,<2.0",
  "openai>=1.99,<3.0",
  "sentence-transformers>=5.0,<6.0",
]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "pytest-cov>=6.2,<7.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
